# ─────────────────────────────────────────────────────────────────────────────
# AkisCFD — Production Docker Compose  (Hetzner Cloud / linux/amd64)
#
# Services: nginx → api + frontend static, worker, redis, flower
#
# Usage:
#   cp .env.prod.example .env.prod
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  api:
    image: ghcr.io/fthmtzkl/akiscfd:${IMAGE_TAG:-latest}
    platform: linux/amd64
    restart: always
    expose:
      - "8000"
    environment:
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=sqlite:////data/akiscfd.db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - UPLOAD_DIR=/data/uploads
      - SIMULATIONS_DIR=/data/simulations
      - CORS_ORIGINS=${CORS_ORIGINS:-https://akiscfd.com}
      - MAX_UPLOAD_SIZE_MB=200
      - MAX_CONCURRENT_JOBS=4
      - JOB_TIMEOUT_SECONDS=7200
      - PYTHONPATH=/app
    volumes:
      - cfd_data:/data
      - ../simulations:/app/../simulations:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Celery Worker ───────────────────────────────────────────────────────────
  worker:
    image: ghcr.io/fthmtzkl/akiscfd:${IMAGE_TAG:-latest}
    platform: linux/amd64
    restart: always
    command: ["bash", "-c",
      "source /usr/lib/openfoam/openfoam2312/etc/bashrc 2>/dev/null || true && \
       celery -A app.celery_app worker --loglevel=info --concurrency=2 --queues=cfd_simulations"]
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=sqlite:////data/akiscfd.db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - UPLOAD_DIR=/data/uploads
      - SIMULATIONS_DIR=/data/simulations
      - PYTHONPATH=/app
    volumes:
      - cfd_data:/data
      - ../simulations:/app/../simulations:ro
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "6"
          memory: 12G

  # ── Celery Flower ───────────────────────────────────────────────────────────
  flower:
    image: mher/flower:2.0
    restart: always
    expose:
      - "5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - FLOWER_PORT=5555
      - FLOWER_BASIC_AUTH=${FLOWER_AUTH:-admin:changeme}
    depends_on:
      - redis

  # ── Nginx (reverse proxy + static files) ────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  redis_data:
  cfd_data:
  letsencrypt:
