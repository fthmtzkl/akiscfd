# ─────────────────────────────────────────────────────────────────────────────
# CFD Web Application – Docker Compose  (full stack with OpenFOAM)
#
# Services:
#   redis    – Job broker & result backend
#   api      – FastAPI backend (OpenFOAM + Python)  [linux/amd64]
#   worker   – Celery worker for long-running CFD jobs  [linux/amd64]
#   flower   – Celery monitoring UI (http://localhost:5555)
#   frontend – Vite dev server (http://localhost:5173)
#
# On Apple Silicon use OrbStack or Docker Desktop with Rosetta enabled.
# For a lighter dev setup (mock runner, no OpenFOAM) use docker-compose.dev.yml
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── FastAPI Backend ────────────────────────────────────────────────────────
  api:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEBUG=false
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - UPLOAD_DIR=/data/uploads
      - SIMULATIONS_DIR=/data/simulations
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
      - MAX_UPLOAD_SIZE_MB=200
      - MAX_CONCURRENT_JOBS=4
      - JOB_TIMEOUT_SECONDS=7200
      - PYTHONPATH=/app
    volumes:
      - cfd_data:/data
      - ../simulations:/app/../simulations:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Celery Worker ──────────────────────────────────────────────────────────
  worker:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /app
    command: ["bash", "-c", "source /usr/lib/openfoam/openfoam2312/etc/bashrc && celery -A app.celery_app worker --loglevel=info --concurrency=2 --queues=cfd_simulations"]
    environment:
      - DEBUG=false
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - UPLOAD_DIR=/data/uploads
      - SIMULATIONS_DIR=/data/simulations
      - PYTHONPATH=/app
    volumes:
      - cfd_data:/data
      - ../simulations:/app/../simulations:ro
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G

  # ── Celery Flower (monitoring) ─────────────────────────────────────────────
  flower:
    image: mher/flower:2.0
    restart: unless-stopped
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - FLOWER_PORT=5555
    depends_on:
      - redis

  # ── React Frontend (Vite dev server) ──────────────────────────────────────
  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  redis_data:
  cfd_data:
  frontend_node_modules:
