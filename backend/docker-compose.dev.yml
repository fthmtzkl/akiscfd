# ─────────────────────────────────────────────────────────────────────────────
# CFD Web Application – Dev Docker Compose  (mock runner, no OpenFOAM)
#
# Fast development setup. Runs on any architecture (arm64 + amd64).
# Simulations use the mock runner – realistic results without OpenFOAM.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up --build
#
# URLs:
#   Frontend  →  http://localhost:5173
#   Backend   →  http://localhost:8000
#   API docs  →  http://localhost:8000/api/docs
# ─────────────────────────────────────────────────────────────────────────────

services:

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEBUG=true
      - REDIS_URL=redis://redis:6379/0
      - UPLOAD_DIR=/tmp/cfd_uploads
      - SIMULATIONS_DIR=/tmp/cfd_simulations
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
      - MAX_UPLOAD_SIZE_MB=100
      - JOB_TIMEOUT_SECONDS=600
      - PYTHONPATH=/app
    volumes:
      - ./app:/app/app
      - ../simulations:/app/../simulations:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  frontend_node_modules:
